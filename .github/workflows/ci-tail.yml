name: ci-tail
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: hunter2
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      POSTGRES_HOST: 127.0.0.1
      PGPORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hunter2
      POSTGRES_DB: github_actions
      SECRET_KEY: beepbeep
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/v0.9.4
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: |
          python -m pip install --upgrade "pip>=25.1.0"
          pip install --group main --group dev
          pip install pytest-github-actions-annotate-failures
      - run: cp .env.example .env
      - run: python ./manage.py compile_themes
      - run: python ./manage.py collectstatic --no-input
      - name: pytest and surface the tail
        run: |
          set +e
          pytest -n 3 -q > /tmp/p.log 2>&1
          code=$?
          echo "pytest exited $code"
          echo "::error title=pytest-exit::$code"
          tail -n 12 /tmp/p.log | while IFS= read -r line; do
            echo "::error title=tail::${line}"
          done
