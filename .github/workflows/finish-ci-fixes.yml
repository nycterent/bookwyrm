name: finish-ci-fixes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/v0.9.4
          fetch-depth: 0
      - name: Apply the remaining fixes
        run: |
          set -euo pipefail
          python -m pip install --quiet "ruff==0.14.7"
          git show origin/main:.github/finish-ci-fixes.py > /tmp/fix.py
          python /tmp/fix.py
          ruff format .
          ruff check --fix . || true
          ruff format .
          git diff --stat
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "ziurkes sync"
          git config user.email "sync@ziurkes.group.lt"
          git add -A
          git commit -m "Treat 410s as gone and give the backoff tests a real cache"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git push origin HEAD:refs/heads/sync/v0.9.4
