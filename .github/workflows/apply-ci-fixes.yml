name: apply-ci-fixes
on:
  workflow_dispatch:
  push:
    branches: [fixapply]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      TARGET_TREE: 179e2f38225fe81e19ad0308340006c55a1cd472
      EXPECTED_SHA: 410eadda1a930b37fd50bbf9702fffcd3e82a0bd1adf52b68c656ac6e4c7b559
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/v0.9.4
          fetch-depth: 0
      - name: Assemble and apply the patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs"
          for sha in 7d7d61a327c016b1ac5c96e78ad950541e4380a3 7fe2c93bc8273f40dfa7e0e266ba7ed7d431af58; do
            curl -sSfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" "$base/$sha" >> /tmp/fix.gz
          done
          got=$(sha256sum /tmp/fix.gz | cut -d' ' -f1)
          echo "assembled: $got"
          test "$got" = "$EXPECTED_SHA"
          gunzip -c /tmp/fix.gz > /tmp/fix.patch
          git apply --whitespace=nowarn /tmp/fix.patch
          git status --short
      - name: Re-apply the same ruff passes and the stylelint autofix CI expects
        run: |
          set -euo pipefail
          python -m pip install --quiet "ruff==0.14.7"
          ruff format .
          ruff check --fix . || true
          ruff format .
          mkdir -p /tmp/sl && cd /tmp/sl
          npm install --silent --no-fund --no-audit stylelint stylelint-config-recommended stylelint-config-standard stylelint-order stylelint-config-standard-scss
          cd "$GITHUB_WORKSPACE"
          ln -sfn /tmp/sl/node_modules dev-tools/node_modules
          npx stylelint bookwyrm/static/css --config dev-tools/.stylelintrc.js --ignore-path dev-tools/.stylelintignore --fix || true
          rm -f dev-tools/node_modules
          echo node_modules >> .git/info/exclude
      - name: Commit, verify the tree, push
        run: |
          set -euo pipefail
          git config user.name "ziurkes sync"
          git config user.email "sync@ziurkes.group.lt"
          git add -A
          git commit -m "Fix the CI checks broken by the v0.9.4 merge"
          tree=$(git rev-parse HEAD^{tree})
          echo "produced: $tree"
          echo "expected: $TARGET_TREE"
          if [ "$tree" != "$TARGET_TREE" ]; then
            echo "::error::produced tree differs from the verified tree"
            git diff --stat HEAD~1 HEAD
            exit 1
          fi
          git push origin HEAD:refs/heads/sync/v0.9.4
