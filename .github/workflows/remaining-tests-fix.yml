name: remaining-tests-fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/v0.9.4
          fetch-depth: 0
      - name: Apply the remaining test fixes
        run: |
          set -euo pipefail
          python -m pip install --quiet "ruff==0.14.7"
          git show origin/main:.github/remaining-tests-fix.py > /tmp/fix.py
          python /tmp/fix.py
          ruff format .
          git diff --stat
      - name: Commit, verify the tree, push
        run: |
          set -euo pipefail
          git config user.name "ziurkes sync"
          git config user.email "sync@ziurkes.group.lt"
          git add -A
          git commit -m "Fix the remaining view and backoff test failures"
          tree=$(git rev-parse HEAD^{tree})
          echo "produced: $tree"
          if [ "$tree" != "1a625283b0e6898ecf957d1f773279e98492d40f" ]; then
            echo "::error::produced tree differs from the verified tree"
            git diff --stat HEAD~1 HEAD
            exit 1
          fi
          git push origin HEAD:refs/heads/sync/v0.9.4
