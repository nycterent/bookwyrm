name: drop-readwise
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/v0.9.4
          fetch-depth: 0
      - name: Apply the removal
        run: |
          echo '' | base64 -d > /tmp/drop.py
          ROOT=bookwyrm python3 /tmp/drop.py
      - name: Assert, commit and push
        run: |
          git config user.name "Marty"
          git config user.email "saint@ghost.lt"
          git add -A
          tree=$(git write-tree)
          echo "resulting tree: $tree"
          test "$tree" = "19f26ad45d613f420b5db26557a504f0c1f423ec"
          git commit -q -m "Drop the Readwise integration" -m "Removes the fork-only Readwise surface: connector, settings view, form, templates, create-status hook and admin stats. The models, user fields and historical migrations stay so stored tokens and highlight rows are not destroyed."
          git push origin HEAD:sync/v0.9.4
