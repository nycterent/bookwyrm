name: ci-annotations
on:
  workflow_dispatch:
permissions:
  checks: read
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump the failure annotations
        run: |
          curl -sS \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/check-runs/124689077987/annotations" \
            -o /tmp/a.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/a.json'))
          for a in data:
              msg = ' | '.join(
                  line.strip()
                  for line in (a.get('message') or '').splitlines()
                  if line.strip().startswith('FAILED') or 'Error' in line
              )[:400]
              print(f"{a['path']}:{a.get('start_line')}: {msg}")
          print('count', len(data))
          PY
