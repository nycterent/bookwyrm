name: ci-annotations
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Grep the pytest summary and tail out of the job log
        run: |
          curl -sSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/jobs/124867102864/logs" \
            -o /tmp/job.log
          echo "log bytes: $(wc -c < /tmp/job.log)"
          echo '=== summary ==='
          grep -aE '^[0-9T:.Z-]+ (FAILED|ERROR) ' /tmp/job.log | sed -E 's/^[0-9-]+T[0-9:.]+Z //' | tail -n 25
          echo '=== tail ==='
          tail -n 60 /tmp/job.log | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z //'
